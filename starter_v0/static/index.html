<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { font-family: 'Inter', sans-serif; box-sizing: border-box; }
body { margin: 0; background: #111; color: #e5e5e5; height: 100vh; display: flex; }
#sidebar { width: 260px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a; flex-shrink: 0; }
@media (max-width: 768px) {
  #sidebar { display: none; position: fixed; top: 0; left: 0; height: 100%; z-index: 50; }
  #sidebar.show { display: flex; }
}
#sidebar-header { padding: 14px 16px; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 10px; }
#sidebar-header .logo { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #a855f7); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
#sidebar-header .info { flex: 1; min-width: 0; }
#sidebar-header .name { font-weight: 600; font-size: 14px; }
#sidebar-header .sub { font-size: 10px; color: #888; }
#chat-list { flex: 1; overflow-y: auto; padding: 8px; }
#chat-list .item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 2px; transition: background 0.15s; display: flex; align-items: center; gap: 8px; }
#chat-list .item:hover { background: #2a2a2a; }
#chat-list .item.active { background: #2f2f2f; }
#chat-list .item .icon { width: 16px; height: 16px; color: #888; flex-shrink: 0; }
#chat-list .item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#chat-list .empty { text-align: center; padding: 40px 16px; color: #555; font-size: 12px; }
#sidebar-footer { padding: 12px; border-top: 1px solid #2a2a2a; }
#sidebar-footer button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: none; color: #ccc; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s; }
#sidebar-footer button:hover { background: #2a2a2a; }
#sidebar-footer .stats { padding: 6px 8px 0; font-size: 10px; color: #555; }

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#header { display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid #2a2a2a; background: #111; gap: 8px; }
#header .menu-btn { padding: 6px; border-radius: 8px; cursor: pointer; border: none; background: none; color: #888; }
#header .menu-btn:hover { background: #2a2a2a; }
#header .title-area { flex: 1; text-align: center; font-size: 13px; color: #666; }
#header .action-btn { padding: 6px; border-radius: 8px; cursor: pointer; border: none; background: none; color: #888; }
#header .action-btn:hover { background: #2a2a2a; }

#chat-area { flex: 1; overflow-y: auto; padding: 24px 16px; }
#chat-area .inner { max-width: 768px; margin: 0 auto; }

#welcome { text-align: center; padding: 80px 16px; }
#welcome .logo-big { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #a855f7); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; color: #fff; margin-bottom: 16px; }
#welcome h1 { font-size: 22px; font-weight: 600; background: linear-gradient(135deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 0 0 8px; }
#welcome p { color: #666; font-size: 13px; line-height: 1.6; max-width: 400px; margin: 0 auto; }

.msg { margin-bottom: 20px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: #2a2a2a; border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 75%; font-size: 14px; line-height: 1.5; }
.msg.assistant { display: flex; gap: 12px; }
.msg.assistant .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #a855f7); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0; margin-top: 2px; }
.msg.assistant .content { flex: 1; min-width: 0; }

.tc { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
.tc-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 12px; color: #60a5fa; font-weight: 500; user-select: none; }
.tc-head:hover { background: #222; }
.tc-head svg { width: 14px; height: 14px; flex-shrink: 0; }
.tc-head .arrow { margin-left: auto; color: #555; transition: transform 0.2s; }
.tc-head .arrow.open { transform: rotate(180deg); }
.tc-body { display: none; padding: 4px 12px 10px 34px; font-size: 11px; color: #999; }
.tc-body.open { display: block; }

.markdown { font-size: 14px; line-height: 1.7; }
.markdown p { margin: 0 0 8px; }
.markdown p:empty { display: none; }
.markdown p:last-child { margin-bottom: 0; }
.markdown ul, .markdown ol { padding-left: 20px; margin: 6px 0; }
.markdown li { margin: 2px 0; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { font-weight: 600; margin: 16px 0 8px; }
.markdown h1 { font-size: 18px; } .markdown h2 { font-size: 16px; } .markdown h3 { font-size: 15px; }
.markdown code { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #e879f9; }
.markdown pre { background: #1a1a1a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.markdown pre code { background: none; padding: 0; color: inherit; }
.markdown blockquote { border-left: 3px solid #333; padding-left: 12px; color: #888; margin: 8px 0; }
.markdown a { color: #60a5fa; text-decoration: underline; }
.markdown table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
.markdown th, .markdown td { border: 1px solid #2a2a2a; padding: 6px 10px; }
.markdown th { background: #1a1a1a; }

.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing span { width: 7px; height: 7px; background: #666; border-radius: 50%; animation: t 1.4s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes t { 0%,60%,100% { opacity: 0.2; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }

#input-area { padding: 8px 16px 16px; background: #111; }
#input-area .inner { max-width: 768px; margin: 0 auto; }
#input-box { display: flex; align-items: flex-end; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 16px; padding: 8px 12px; transition: border-color 0.2s; }
#input-box:focus-within { border-color: #555; }
#input-box textarea { flex: 1; background: none; border: none; outline: none; color: #e5e5e5; font-size: 14px; font-family: inherit; resize: none; max-height: 150px; padding: 2px 0; }
#input-box textarea::placeholder { color: #666; }
#input-box button { margin-left: 8px; padding: 8px; border-radius: 10px; border: none; cursor: pointer; background: #fff; color: #111; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s; }
#input-box button:disabled { opacity: 0.2; cursor: default; }
#input-box button:not(:disabled):hover { background: #e5e5e5; }
#input-box button svg { width: 18px; height: 18px; }
#input-area .footnote { text-align: center; font-size: 10px; color: #444; margin-top: 6px; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <div class="logo">R</div>
    <div class="info">
      <div class="name">Research Agent</div>
      <div class="sub" id="model-label">Loading...</div>
    </div>
  </div>
  <div id="chat-list"><div class="empty">No conversations</div></div>
  <div id="sidebar-footer">
    <button onclick="newChat()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
      New chat
    </button>
    <div class="stats" id="tools-label"></div>
  </div>
</aside>

<div id="main">
  <div id="header">
    <button class="menu-btn" onclick="toggleSidebar()" title="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="title-area" id="header-title">Research Agent</div>
    <button class="action-btn" onclick="newChat()" title="New chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
    </button>
  </div>

  <div id="chat-area">
    <div class="inner" id="messages">
      <div id="welcome">
        <div class="logo-big">R</div>
        <h1>Research Agent</h1>
        <p>AI research assistant with real-time tools.<br>News, Twitter, Wikipedia, weather, crypto, and more.</p>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="inner">
      <div id="input-box">
        <textarea id="chat-input" rows="1" placeholder="Send a message..." oninput="onInput()" onkeydown="onKey(event)"></textarea>
        <button id="send-btn" onclick="sendMsg()" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"/></svg>
        </button>
      </div>
      <div class="footnote">May use external tools. Verify important info.</div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let chats = [];
let curId = null;
let streaming = false;
let abort = null;

function $(id) { return document.getElementById(id); }

function escape(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function autoSize() {
  var el = $('chat-input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function onInput() {
  var v = $('chat-input').value.trim();
  $('send-btn').disabled = !v || streaming;
  autoSize();
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function toggleSidebar() {
  var s = $('sidebar');
  if (window.innerWidth < 768) { s.classList.toggle('show'); }
  else { s.style.display = s.style.display === 'none' ? 'flex' : 'none'; }
}

function getChat() { return chats.find(function(c) { return c.id === curId; }); }

function newChat() {
  if (streaming && abort) abort.abort();
  var id = Date.now().toString();
  curId = id;
  chats.unshift({ id: id, title: 'New chat', msgs: [] });
  renderSidebar();
  renderMsgs();
  $('chat-input').focus();
}

function updateHeader() {
  var chat = getChat();
  $('header-title').textContent = chat ? chat.title : 'Research Agent';
}

function renderSidebar() {
  var list = $('chat-list');
  if (chats.length === 0) {
    list.innerHTML = '<div class="empty">No conversations</div>';
    return;
  }
  updateHeader();
  list.innerHTML = chats.map(function(c) {
    var a = c.id === curId ? ' active' : '';
    return '<div class="item' + a + '" onclick="switchChat(\'' + c.id + '\')">' +
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>' +
      '<span class="title">' + escape(c.title) + '</span></div>';
  }).join('');
}

function switchChat(id) {
  if (streaming && abort) abort.abort();
  curId = id;
  renderSidebar();
  renderMsgs();
}

function renderMsgs() {
  var area = $('messages');
  var welcome = $('welcome');
  var chat = getChat();
  if (!chat || chat.msgs.length === 0) {
    welcome.style.display = '';
    area.innerHTML = ''; area.appendChild(welcome);
    return;
  }
  welcome.style.display = 'none';
  area.innerHTML = chat.msgs.map(function(m, i) { return buildMsg(m, i); }).join('');
  $('chat-area').scrollTop = $('chat-area').scrollHeight;
}

function buildMsg(m, i) {
  if (m.role === 'user') {
    return '<div class="msg user" id="m-' + i + '"><div class="bubble">' + escape(m.content) + '</div></div>';
  }
  var h = '<div class="msg assistant" id="m-' + i + '">';
  h += '<div class="avatar">R</div><div class="content">';
  if (m.tools && m.tools.length) {
    h += '<div style="margin-bottom:8px">';
    m.tools.forEach(function(t, idx) {
      var tid = 't-' + i + '-' + idx;
      h += '<div class="tc"><div class="tc-head" onclick="toggleT(\'' + tid + '\')">';
      h += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>';
      h += escape(t.name);
      h += '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>';
      h += '</div><div class="tc-body" id="' + tid + '"><pre style="margin:0;font-size:11px;color:#999">' + escape(JSON.stringify(t.args, null, 2)) + '</pre></div></div>';
    });
    h += '</div>';
  }
  if (m.text) {
    h += '<div class="markdown">' + md(m.text) + '</div>';
  }
  h += '</div></div>';
  return h;
}

function toggleT(id) {
  var el = $(id);
  if (!el) return;
  el.classList.toggle('open');
  var arrow = el.previousElementSibling.querySelector('.arrow');
  if (arrow) arrow.classList.toggle('open');
}

async function sendMsg() {
  var input = $('chat-input');
  var text = input.value.trim();
  if (!text || streaming) return;

  input.value = '';
  autoSize();
  onInput();

  var chat = getChat();
  if (!chat) { newChat(); chat = getChat(); }

  if (chat.msgs.length === 0) {
    chat.title = text.length > 45 ? text.substring(0, 45) + '...' : text;
    updateHeader();
    renderSidebar();
  }

  chat.msgs.push({ role: 'user', content: text });
  var msgIdx = chat.msgs.length;
  chat.msgs.push({ role: 'assistant', text: '', tools: [] });
  renderMsgs();

  var lastEl = $('m-' + (chat.msgs.length - 1));
  if (lastEl) {
    lastEl.querySelector('.content').innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  }

  streaming = true;
  abort = new AbortController();
  var timeoutId = setTimeout(function() { if (abort) abort.abort(); }, 90000);
  var fullText = '';

  try {
    var history = [];
    for (var j = 0; j < chat.msgs.length - 1; j++) {
      var m = chat.msgs[j];
      if (m.role !== 'system') {
        history.push({ role: m.role, content: m.role === 'assistant' ? m.text : m.content });
      }
    }

    var res = await fetch(API + '/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history }),
      signal: abort.signal,
    });
    clearTimeout(timeoutId);

    if (!res.ok) throw new Error('HTTP ' + res.status);

    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';

    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += decoder.decode(r.value, { stream: true });
      var lines = buf.split('\n');
      buf = lines.pop() || '';

      for (var k = 0; k < lines.length; k++) {
        var line = lines[k];
        if (line.indexOf('data: ') !== 0) continue;
        var data = line.substring(6).trim();
        if (data === '[DONE]') continue;
        try {
          var ev = JSON.parse(data);
          var last = chat.msgs[chat.msgs.length - 1];
          if (ev.type === 'text') {
            fullText += ev.content;
            last.text = fullText;
            renderAssistantContent(msgIdx, last.tools || [], fullText);
          } else if (ev.type === 'tool_call') {
            if (!last.tools) last.tools = [];
            last.tools.push(ev.content);
            renderAssistantContent(msgIdx, last.tools, fullText);
          }
          $('chat-area').scrollTop = $('chat-area').scrollHeight;
        } catch(e) {}
      }
    }

    var last = chat.msgs[chat.msgs.length - 1];
    if (last) {
      if (fullText) last.text = fullText;
      renderAssistantContent(msgIdx, last.tools || [], fullText);
    }

  } catch(e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      var el = $('m-' + msgIdx);
      if (el) el.innerHTML = '<div class="avatar">R</div><div class="content"><div class="markdown"><p style="color:#f87171">Request timed out. Try again.</p></div></div>';
    } else {
      var el = $('m-' + msgIdx);
      if (el) el.innerHTML = '<div class="avatar">R</div><div class="content"><div class="markdown"><p style="color:#f87171">Error: ' + escape(e.message) + '</p></div></div>';
    }
  }

  streaming = false;
  abort = null;
  onInput();
  renderSidebar();
}

function buildToolsHtml(tools, msgIdx) {
  var h = '<div style="margin-bottom:8px">';
  tools.forEach(function(t, idx) {
    var id = 't-' + msgIdx + '-' + idx;
    h += '<div class="tc"><div class="tc-head" onclick="toggleT(\'' + id + '\')">';
    h += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>';
    h += escape(t.name);
    h += '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>';
    h += '</div><div class="tc-body" id="' + id + '"><pre style="margin:0;font-size:11px;color:#999">' + escape(JSON.stringify(t.args, null, 2)) + '</pre></div></div>';
  });
  h += '</div>';
  return h;
}

function renderAssistantContent(msgIdx, tools, text) {
  var h = '<div class="avatar">R</div><div class="content">';
  if (tools && tools.length) h += buildToolsHtml(tools, msgIdx);
  if (text) h += '<div class="markdown">' + md(text) + '</div>';
  h += '</div>';
  var el = $('m-' + msgIdx);
  if (el) el.innerHTML = h;
}

function md(s) {
  if (typeof marked !== 'undefined' && md) return md(s);
  var r = escape(s);
  r = r.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  r = r.replace(/`([^`]+)`/g, '<code>$1</code>');
  r = r.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  r = r.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  r = r.replace(/^#{3}\s+(.*)$/gm, '<h3>$1</h3>');
  r = r.replace(/^#{2}\s+(.*)$/gm, '<h2>$1</h2>');
  r = r.replace(/^#{1}\s+(.*)$/gm, '<h1>$1</h1>');
  r = r.replace(/^- (.+)$/gm, '<li>$1</li>');
  r = r.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  r = r.replace(/\n\n/g, '</p><p>');
  r = '<p>' + r + '</p>';
  return r;
}

var scripts = ['https://cdn.tailwindcss.com', 'https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.6/marked.min.js'];
scripts.forEach(function(src) { var s = document.createElement('script'); s.src = src; s.async = true; document.body.appendChild(s); });

$('chat-input').focus();

fetch(API + '/api/config').then(function(r) { return r.json(); }).then(function(c) {
  $('model-label').textContent = c.model;
  $('tools-label').textContent = c.tools_count + ' tools';
}).catch(function() {
  $('model-label').textContent = 'Offline';
});

newChat();
</script>
</body>
</html>
