tools:
  - name: clarify
    description: "Hỏi người dùng để lấy thông tin còn thiếu (handle, URL, xác nhận). Dùng khi request thiếu thông tin bắt buộc hoặc cần confirm trước hành động ghi."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây của một tài khoản Twitter. Dùng khi user hỏi về tweet/post CỦA một người cụ thể."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle (lowercase, vd: elonmusk, sama, karpathy). KHÔNG dùng tên đầy đủ."}
        limit: {type: integer, default: 5, description: "Số lượng tweet muốn lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên Twitter theo chủ đề/từ khóa. Dùng khi user muốn biết mọi người đang bàn gì về một chủ đề."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm (keyword ngắn)"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest = mới nhất, Top = phổ biến nhất"}
        limit: {type: integer, default: 5, description: "Số lượng kết quả"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên web. Dùng khi user hỏi tin tức hoặc thông tin về một chủ đề."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa ngắn (1-2 từ). KHÔNG copy nguyên câu hỏi, vd: 'AI' thay vì 'AI news today'"}
        topic: {type: string, enum: [general, news], default: "general", description: "news = tin tức thời sự, general = thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day = hôm nay, week = tuần này, month = tháng này, year = năm nay"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một URL. Dùng khi user đã cung cấp link cụ thể và muốn đọc/tóm tắt."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: send
    description: "Gửi văn bản lên Telegram. Chỉ gọi sau khi đã dùng clarify để hỏi user 'có đồng ý gửi không?' và nhận được xác nhận. Không bao giờ tự gửi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Bắt buộc = true. Chỉ true khi user nói rõ đồng ý. Mặc định false."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo từ arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Extra tools (free, no API key) ----------------
  - name: wikipedia
    description: "Tra cứu thông tin từ Wikipedia. Dùng khi user muốn tìm hiểu về một khái niệm, chủ đề, hoặc nhân vật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: define
    description: "Tra nghĩa từ vựng tiếng Anh (từ điển). Dùng khi user hỏi definition của một từ."
    parameters:
      type: object
      properties:
        word: {type: string, default: "", description: "Từ cần tra"}
      required: [word]

  - name: hn_search
    description: "Tìm bài viết trên Hacker News. Dùng khi user muốn biết thảo luận về chủ đề công nghệ trên HN."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: weather
    description: "Tra thời tiết hiện tại theo tọa độ. Dùng khi user hỏi thời tiết ở một địa điểm."
    parameters:
      type: object
      properties:
        latitude: {type: number, default: 0, description: "Vĩ độ"}
        longitude: {type: number, default: 0, description: "Kinh độ"}
      required: [latitude, longitude]

  - name: country_info
    description: "Tra thông tin quốc gia (dân số, thủ đô, tiền tệ, ngôn ngữ). Dùng khi user hỏi về một nước."
    parameters:
      type: object
      properties:
        country: {type: string, default: "", description: "Tên quốc gia"}
      required: [country]

  - name: ip_info
    description: "Tra thông tin địa lý của một địa chỉ IP. Dùng khi user muốn biết IP thuộc đâu."
    parameters:
      type: object
      properties:
        ip: {type: string, default: "", description: "Địa chỉ IP"}
      required: [ip]

  - name: math_calc
    description: "Tính toán biểu thức toán học. Dùng khi user muốn giải phương trình, tính số, hoặc rút gọn biểu thức."
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Biểu thức toán học (vd: 2+2, x^2+2*x+1, sin(pi/2))"}
      required: [expression]

  - name: hackernews
    description: "Lấy top stories hiện tại trên Hacker News. Dùng khi user muốn biết tin công nghệ hot."
    parameters:
      type: object
      properties:
        max_results: {type: integer, default: 5, description: "Số lượng story"}
      required: [max_results]

  - name: exchange_rate
    description: "Tra tỷ giá ngoại tệ. Dùng khi user muốn đổi tiền hoặc biết tỷ giá giữa 2 loại tiền."
    parameters:
      type: object
      properties:
        base: {type: string, default: "USD", description: "Tiền gốc (vd: USD, EUR, VND)"}
        target: {type: string, default: "EUR", description: "Tiền đích"}
        amount: {type: number, default: 1, description: "Số tiền cần đổi"}
      required: [base, target]

  - name: crypto_price
    description: "Tra giá cryptocurrency. Dùng khi user hỏi giá Bitcoin, Ethereum, hoặc coin khác."
    parameters:
      type: object
      properties:
        coin: {type: string, default: "bitcoin", description: "Tên coin (vd: bitcoin, ethereum)"}
        vs_currency: {type: string, default: "usd", description: "Tiền đối chiếu (vd: usd, vnd)"}
      required: [coin]
