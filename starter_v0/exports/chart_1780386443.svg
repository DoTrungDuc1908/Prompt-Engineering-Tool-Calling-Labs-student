<svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Gradient background -->
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>
        <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
        <linearGradient id="line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background card -->
    <rect width="700" height="400" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Chart Title -->
    <text x="350.0" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">So sánh điểm số</text>
    <!-- Y Grid Line -->
    <line x1="120" y1="340.0" x2="660" y2="340.0" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4"/>
    <text x="105" y="344.0" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">0.0</text>
    <!-- Y Grid Line -->
    <line x1="120" y1="270.0" x2="660" y2="270.0" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4"/>
    <text x="105" y="274.0" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">25.0</text>
    <!-- Y Grid Line -->
    <line x1="120" y1="200.0" x2="660" y2="200.0" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4"/>
    <text x="105" y="204.0" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">50.0</text>
    <!-- Y Grid Line -->
    <line x1="120" y1="130.0" x2="660" y2="130.0" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4"/>
    <text x="105" y="134.0" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">75.0</text>
    <!-- Y Grid Line -->
    <line x1="120" y1="60.0" x2="660" y2="60.0" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4"/>
    <text x="105" y="64.0" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">100.0</text>
    <!-- Bar -->
    <rect x="127.5" y="215.68" width="255.0" height="124.32" rx="6" fill="url(#bar-grad)" filter="url(#glow)"/>
    <!-- Value on top of Bar -->
    <text x="255.0" y="207.68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="11" fill="#38bdf8">44.4%</text>
    <!-- Category Label -->
    <text x="255.0" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">v0</text>
    <!-- Bar -->
    <rect x="397.5" y="60.0" width="255.0" height="280.0" rx="6" fill="url(#bar-grad)" filter="url(#glow)"/>
    <!-- Value on top of Bar -->
    <text x="525.0" y="52.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="11" fill="#38bdf8">100.0%</text>
    <!-- Category Label -->
    <text x="525.0" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">v3</text>

    <!-- Axes -->
    <line x1="120" y1="60" x2="120" y2="340" stroke="#334155" stroke-width="1.5"/>
    <line x1="120" y1="340" x2="660" y2="340" stroke="#334155" stroke-width="1.5"/>
</svg>
