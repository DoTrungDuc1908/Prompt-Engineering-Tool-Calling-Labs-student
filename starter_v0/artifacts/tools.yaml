tools:
  - name: clarify
    description: "Hỏi người dùng để lấy thông tin còn thiếu (handle, URL, xác nhận). Dùng khi request thiếu thông tin bắt buộc hoặc cần confirm trước hành động ghi."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây của một tài khoản Twitter. Dùng khi user hỏi về tweet/post CỦA một người cụ thể."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle (lowercase, vd: elonmusk, sama, karpathy). KHÔNG dùng tên đầy đủ."}
        limit: {type: integer, default: 5, description: "Số lượng tweet muốn lấy"}
      required: [screenname]

  - name: social_search
    description: "Search social media (Twitter/X) for a specific query topic. Set search_type='Top' for popular posts, and 'Latest' for recent posts. Only call once per search query, do not make duplicate calls."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Strictly the core keyword topic to search (e.g. 'AI', 'GPT-5')."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top for popular, Latest for recent."}
        limit: {type: integer, default: 5, description: "Number of posts to fetch."}
      required: [query, search_type]

  - name: lookup
    description: "Lookup information on the internet. MUST set topic='news' strictly for news, current events, recent updates, 'tin tức', 'hôm nay có gì', or articles."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Strictly the core keyword topic to search (e.g. 'AI', 'robotics')."}
        topic: {type: string, enum: [general, news], default: "general", description: "Must set to 'news' strictly for news/tin tức/tin nổi bật/current events/articles. Otherwise set to 'general'."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Filter by timeframe (day for today/hôm nay, week for this week, month, year)."}
        max_results: {type: integer, default: 5, description: "Number of results."}
      required: [query, topic, timeframe]

  - name: fetch
    description: "Lấy nội dung từ một URL. Dùng khi user đã cung cấp link cụ thể và muốn đọc/tóm tắt."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: send
    description: "Gửi văn bản lên Telegram. Chỉ gọi sau khi đã dùng clarify để hỏi user 'có đồng ý gửi không?' và nhận được xác nhận. Không bao giờ tự gửi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Bắt buộc = true. Chỉ true khi user nói rõ đồng ý. Mặc định false."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo từ arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: get_time
    description: "Get the current local date and time of the system, including timezone and day of the week."
    parameters:
      type: object
      properties: {}

  - name: text_statistics
    description: "Calculates statistics for a block of text, such as word count, character count, sentence count, reading time, and vocabulary diversity."
    parameters:
      type: object
      properties:
        text: {type: string, description: "The block of text to analyze."}
      required: [text]

  - name: sentiment_analysis
    description: "Analyzes the sentiment of a text block (returns Positive, Negative, or Neutral sentiment label and confidence score)."
    parameters:
      type: object
      properties:
        text: {type: string, description: "The text block to analyze."}
      required: [text]

  - name: agent_memory
    description: "Saves or retrieves persistent knowledge, notes, or preferences to/from the agent's long-term memory store. Set action='save' to save, 'load' to retrieve, 'delete' to remove, or 'list' to show keys."
    parameters:
      type: object
      properties:
        action: {type: string, enum: [save, load, list, delete], default: "list", description: "The memory operation to execute."}
        key: {type: string, default: "", description: "The specific key identifier for the memory entry."}
        value: {type: string, default: "", description: "The content value to store (required only for action='save')."}
      required: [action]

  - name: export_report
    description: "Compiles and exports markdown text or research findings into a beautifully-styled, standalone HTML report file in the exports directory."
    parameters:
      type: object
      properties:
        title: {type: string, default: "Research Report", description: "The title of the generated HTML report."}
        content_markdown: {type: string, default: "", description: "Full Markdown formatted string to compile into the report."}
        theme: {type: string, enum: [glassmorphism, slate, corporate], default: "glassmorphism", description: "Visual aesthetic theme styling for the report."}
      required: [title, content_markdown, theme]

  - name: visualize_data
    description: "Generates a premium, high-quality SVG bar chart or line chart from a dictionary of category-value data points. Saves the chart as an SVG file."
    parameters:
      type: object
      properties:
        title: {type: string, default: "Data Chart", description: "Title of the generated chart."}
        data_points: {type: object, description: "Dictionary of category keys and numeric float values (e.g. {'v0': 44.4, 'v1': 77.8})."}
        chart_type: {type: string, enum: [bar, line], default: "bar", description: "The chart visualization style (bar or line)."}
      required: [title, data_points, chart_type]

  - name: wikipedia
    description: "Tra cứu nội dung từ Wikipedia. Dùng khi user hỏi về kiến thức tổng quát, lịch sử, khoa học, danh nhân. Không cần API key."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả"}
      required: [query]

  - name: define
    description: "Tra nghĩa từ vựng tiếng Anh (từ loại, định nghĩa, ví dụ). Dùng khi user hỏi 'nghĩa là gì', 'define', 'định nghĩa'. Không cần API key."
    parameters:
      type: object
      properties:
        word: {type: string, default: "", description: "Từ cần tra (tiếng Anh)"}
      required: [word]

  - name: hn_search
    description: "Tìm bài viết trên Hacker News theo từ khóa. Dùng khi user muốn tìm thảo luận kỹ thuật trên HN. Không cần API key."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả"}
      required: [query]

  - name: weather
    description: "Tra thời tiết hiện tại theo tọa độ (nhiệt độ, độ ẩm, tốc độ gió). Dùng khi user hỏi thời tiết. Không cần API key."
    parameters:
      type: object
      properties:
        latitude: {type: number, default: 0.0, description: "Vĩ độ"}
        longitude: {type: number, default: 0.0, description: "Kinh độ"}
      required: [latitude, longitude]

  - name: country_info
    description: "Tra thông tin quốc gia (tên, thủ đô, dân số, diện tích, ngôn ngữ, tiền tệ, cờ). Dùng khi user hỏi về một quốc gia. Không cần API key."
    parameters:
      type: object
      properties:
        country: {type: string, default: "", description: "Tên quốc gia (tiếng Anh, VD: vietnam, france)"}
      required: [country]

  - name: ip_info
    description: "Tra thông tin địa lý của một địa chỉ IP (quốc gia, thành phố, ISP). Dùng khi user hỏi IP ở đâu. Không cần API key."
    parameters:
      type: object
      properties:
        ip: {type: string, default: "", description: "Địa chỉ IP cần tra"}
      required: [ip]

  - name: math_calc
    description: "Tính toán biểu thức toán học. Dùng sympy nếu có, fallback eval nếu không. Hỗ trợ +, -, *, /, ^, sin, cos, sqrt, v.v."
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Biểu thức toán học (VD: 2+2, sin(pi/2), sqrt(144))"}
      required: [expression]

  - name: hackernews
    description: "Lấy danh sách top stories hiện tại trên Hacker News. Không cần từ khóa. Dùng khi user hỏi 'HN top stories', 'hacker news'. Không cần API key."
    parameters:
      type: object
      properties:
        max_results: {type: integer, default: 5, description: "Số lượng story muốn lấy"}
      required: [max_results]

  - name: exchange_rate
    description: "Tra tỷ giá ngoại tệ từ ECB. Dùng khi user hỏi tỷ giá, đổi tiền. Hỗ trợ base, target, amount. Không cần API key."
    parameters:
      type: object
      properties:
        base: {type: string, default: "USD", description: "Mã tiền tệ gốc (VD: USD, EUR, GBP, JPY, VND)"}
        target: {type: string, default: "EUR", description: "Mã tiền tệ đích"}
        amount: {type: number, default: 1.0, description: "Số lượng cần quy đổi"}
      required: [base, target, amount]

  - name: crypto_price
    description: "Tra giá cryptocurrency (Bitcoin, Ethereum, v.v.) theo USD hoặc VND. Dùng khi user hỏi giá crypto, bitcoin. CoinGecko API free, không cần key."
    parameters:
      type: object
      properties:
        coin: {type: string, default: "bitcoin", description: "Tên coin (VD: bitcoin, ethereum, solana)"}
        vs_currency: {type: string, default: "usd", description: "Tiền tệ quy đổi (usd, vnd, eur)"}
      required: [coin, vs_currency]
