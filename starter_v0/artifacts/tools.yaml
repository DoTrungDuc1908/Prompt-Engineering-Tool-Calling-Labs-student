# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Search social media (Twitter/X) for a specific query topic. Set search_type='Top' for popular posts, and 'Latest' for recent posts. Only call once per search query, do not make duplicate calls."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Strictly the core keyword topic to search (e.g. 'AI', 'GPT-5')."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top for popular, Latest for recent."}
        limit: {type: integer, default: 5, description: "Number of posts to fetch."}
      required: [query, search_type]

  - name: lookup
    description: "Lookup information on the internet. MUST set topic='news' strictly for news, current events, recent updates, 'tin tức', 'hôm nay có gì', or articles."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Strictly the core keyword topic to search (e.g. 'AI', 'robotics')."}
        topic: {type: string, enum: [general, news], default: "general", description: "Must set to 'news' strictly for news/tin tức/tin nổi bật/current events/articles. Otherwise set to 'general'."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Filter by timeframe (day for today/hôm nay, week for this week, month, year)."}
        max_results: {type: integer, default: 5, description: "Number of results."}
      required: [query, topic, timeframe]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: get_time
    description: "Get the current local date and time of the system, including timezone and day of the week."
    parameters:
      type: object
      properties: {}

  - name: text_statistics
    description: "Calculates statistics for a block of text, such as word count, character count, sentence count, reading time, and vocabulary diversity."
    parameters:
      type: object
      properties:
        text: {type: string, description: "The block of text to analyze."}
      required: [text]

  - name: sentiment_analysis
    description: "Analyzes the sentiment of a text block (returns Positive, Negative, or Neutral sentiment label and confidence score)."
    parameters:
      type: object
      properties:
        text: {type: string, description: "The text block to analyze."}
      required: [text]

  - name: agent_memory
    description: "Saves or retrieves persistent knowledge, notes, or preferences to/from the agent's long-term memory store. Set action='save' to save, 'load' to retrieve, 'delete' to remove, or 'list' to show keys."
    parameters:
      type: object
      properties:
        action: {type: string, enum: [save, load, list, delete], default: "list", description: "The memory operation to execute."}
        key: {type: string, default: "", description: "The specific key identifier for the memory entry."}
        value: {type: string, default: "", description: "The content value to store (required only for action='save')."}
      required: [action]

  - name: export_report
    description: "Compiles and exports markdown text or research findings into a beautifully-styled, standalone HTML report file in the exports directory."
    parameters:
      type: object
      properties:
        title: {type: string, default: "Research Report", description: "The title of the generated HTML report."}
        content_markdown: {type: string, default: "", description: "Full Markdown formatted string to compile into the report."}
        theme: {type: string, enum: [glassmorphism, slate, corporate], default: "glassmorphism", description: "Visual aesthetic theme styling for the report."}
      required: [title, content_markdown, theme]

  - name: visualize_data
    description: "Generates a premium, high-quality SVG bar chart or line chart from a dictionary of category-value data points. Saves the chart as an SVG file."
    parameters:
      type: object
      properties:
        title: {type: string, default: "Data Chart", description: "Title of the generated chart."}
        data_points: {type: object, description: "Dictionary of category keys and numeric float values (e.g. {'v0': 44.4, 'v1': 77.8})."}
        chart_type: {type: string, enum: [bar, line], default: "bar", description: "The chart visualization style (bar or line)."}
      required: [title, data_points, chart_type]
